<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amba Net</title>

<style>
  :root {
    --bg: #d9dcdf;
    --ink: #23272b;
    --muted: #6b7279;
    --ok: #178a4c;
    --down: #c8372d;
    --warn: #b7791f;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: var(--bg);
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
    color: var(--ink);
  }

  main {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    width: 100%;
    max-width: 420px;
  }

  h1 {
    margin: 0 0 20px;
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -.4px;
  }

  .photo {
    max-width: 100%;
  }

  .photo img {
    display: block;
    width: auto;
    height: auto;
    max-width: 100%;
    max-height: 240px;
    border-radius: 10px;
    box-shadow: 0 10px 24px -12px rgba(0, 0, 0, .35);
  }

  .status {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    margin-top: 22px;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 17px;
    font-weight: 600;
    color: var(--muted);
  }

  .dot {
    width: 11px;
    height: 11px;
    border-radius: 50%;
    background: #9aa1a8;
    flex: none;
  }

  .status.checking .dot { animation: blink 1s ease-in-out infinite; }

  .status.ok   { color: var(--ok); }
  .status.ok .dot   { background: var(--ok); box-shadow: 0 0 0 4px rgba(23, 138, 76, .18); }

  .status.down { color: var(--down); }
  .status.down .dot { background: var(--down); box-shadow: 0 0 0 4px rgba(200, 55, 45, .18); }

  .status.warn { color: var(--warn); }
  .status.warn .dot { background: var(--warn); box-shadow: 0 0 0 4px rgba(183, 121, 31, .18); }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50%      { opacity: .3; }
  }

  @media (prefers-reduced-motion: reduce) {
    .status.checking .dot { animation: none; }
  }
</style>
</head>

<body>
  <main>
    <h1>Amba Net</h1>

    <div class="photo">
      <img src="IMG_20261010_122202_510.jpg" alt="Amba Net" onerror="this.parentNode.style.display='none'">
    </div>

    <div class="status checking" id="status" role="status" aria-live="polite">
      <span class="dot" aria-hidden="true"></span>
      <span id="statusText">... | Memeriksa</span>
    </div>
  </main>

  <script>
    // Alamat yang dicek. Default: halaman ini sendiri.
    // Bisa diganti, misalnya "/health" atau alamat situs yang sama asalnya.
    const CHECK_URL = location.href.split("#")[0];

    const CHECK_EVERY_MS = 30000; // cek ulang tiap 30 detik
    const TIMEOUT_MS = 8000;

    const statusEl = document.getElementById("status");
    const statusText = document.getElementById("statusText");

    function show(code, label, type) {
      statusEl.className = "status " + type;
      statusText.textContent = code + " | " + label;
    }

    function render(code) {
      if (code >= 200 && code < 400) return show(code, "OK", "ok");
      if (code >= 500)               return show(code, "Down", "down");
      return show(code, "Error", "warn");
    }

    async function check() {
      // Simulasi untuk tes: index.html?status=503
      const forced = new URLSearchParams(location.search).get("status");
      if (forced && /^\d{3}$/.test(forced)) return render(Number(forced));

      // Dibuka langsung dari file (file://) tidak bisa dicek
      if (location.protocol === "file:") {
        return show("---", "Buka lewat server", "warn");
      }

      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), TIMEOUT_MS);

      try {
        const res = await fetch(CHECK_URL, {
          method: "HEAD",
          cache: "no-store",
          signal: ctrl.signal
        });
        render(res.status);
      } catch (err) {
        // Tidak ada respons sama sekali (server mati / timeout)
        show("---", "Down", "down");
      } finally {
        clearTimeout(timer);
      }
    }

    check();
    setInterval(check, CHECK_EVERY_MS);
  </script>
</body>
</html>
