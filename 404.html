<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 - Halaman Tidak Ditemukan | Amba Net</title>

<style>
  :root {
    --bg: #e6efed;
    --card: #ffffff;
    --ink: #12302e;
    --muted: #5d7371;
    --line: #d3e0de;
    --accent: #0b7a72;
    --accent-dark: #075c56;
    --accent-soft: #d9f0ed;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 20px;
    background:
      radial-gradient(circle at 15% 10%, #cfe6e2 0, transparent 45%),
      radial-gradient(circle at 90% 90%, #d8e8f0 0, transparent 40%),
      var(--bg);
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
    color: var(--ink);
  }

  .card {
    width: 100%;
    max-width: 380px;
    padding: 32px 28px 24px;
    text-align: center;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 18px;
    box-shadow: 0 18px 40px -18px rgba(11, 80, 74, .35);
    animation: cardIn .6s cubic-bezier(.2, .8, .2, 1) both;
  }

  @keyframes cardIn {
    from { opacity: 0; transform: translateY(14px) scale(.98); }
    to   { opacity: 1; transform: none; }
  }

  .brand {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-bottom: 8px;
  }

  .brand svg { width: 34px; height: 34px; }

  .brand span {
    font-size: 24px;
    font-weight: 700;
    letter-spacing: -.3px;
  }

  /* ---------- Angka 404 ---------- */
  .code {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    margin: 22px 0 6px;
    font-size: 84px;
    font-weight: 800;
    line-height: 1;
    letter-spacing: -2px;
    color: var(--accent);
  }

  .code .digit {
    display: inline-block;
    animation: bob 3s ease-in-out infinite;
  }

  .code .digit:last-child { animation-delay: .5s; }

  /* angka 0 berubah jadi cincin yang berputar */
  .orbit {
    position: relative;
    width: 76px;
    height: 76px;
    flex: none;
  }

  .orbit .ring {
    position: absolute;
    inset: 0;
    border: 9px solid var(--accent-soft);
    border-top-color: var(--accent);
    border-right-color: var(--accent);
    border-radius: 50%;
    animation: spin 2.4s linear infinite;
  }

  .orbit .dot {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 14px;
    height: 14px;
    margin: -7px 0 0 -7px;
    border-radius: 50%;
    background: var(--accent);
    animation: pulse 1.6s ease-in-out infinite;
  }

  h1 {
    margin: 10px 0 0;
    font-size: 22px;
    letter-spacing: -.2px;
  }

  p {
    margin: 10px 0 0;
    color: var(--muted);
    font-size: 14px;
    line-height: 1.6;
  }

  .path {
    display: inline-block;
    max-width: 100%;
    margin-top: 14px;
    padding: 6px 12px;
    border-radius: 8px;
    background: #f1f6f5;
    border: 1px solid var(--line);
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 12px;
    color: var(--muted);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .actions {
    display: grid;
    gap: 10px;
    margin-top: 24px;
  }

  .btn {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 50px;
    border: none;
    border-radius: 12px;
    font: inherit;
    font-size: 15px;
    font-weight: 600;
    text-decoration: none;
    cursor: pointer;
    overflow: hidden;
    transition: transform .15s, box-shadow .2s, background .2s;
  }

  .btn:focus-visible {
    outline: 3px solid rgba(11, 122, 114, .4);
    outline-offset: 2px;
  }

  .btn-primary {
    color: #fff;
    background: linear-gradient(135deg, var(--accent), var(--accent-dark));
    box-shadow: 0 8px 18px -8px rgba(11, 122, 114, .7);
  }

  .btn-primary::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(110deg, transparent 30%, rgba(255, 255, 255, .28) 50%, transparent 70%);
    transform: translateX(-100%);
  }

  .btn-primary:hover { transform: translateY(-1px); }
  .btn-primary:hover::after { animation: shine .9s ease; }
  .btn:active { transform: scale(.98); }

  .btn-ghost {
    color: var(--accent-dark);
    background: transparent;
    border: 1.5px solid var(--line);
  }

  .btn-ghost:hover {
    border-color: #9cc7c2;
    background: #f4faf9;
  }

  .footer {
    margin-top: 20px;
    padding-top: 14px;
    border-top: 1px solid var(--line);
    font-size: 12px;
    color: #8aa09d;
  }

  /* ---------- Keyframes ---------- */
  @keyframes spin  { to { transform: rotate(360deg); } }
  @keyframes shine { to { transform: translateX(100%); } }
  @keyframes bob {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-8px); }
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1);   opacity: 1; }
    50%      { transform: scale(.55); opacity: .5; }
  }

  @media (max-width: 360px) {
    .code { font-size: 68px; }
    .orbit { width: 62px; height: 62px; }
    .orbit .ring { border-width: 8px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: .01ms !important;
    }
  }
</style>
</head>

<body>
  <main class="card">
    <div class="brand">
      <svg viewBox="0 0 40 40" aria-hidden="true">
        <rect width="40" height="40" rx="11" fill="#0b7a72"/>
        <path d="M11 28 L20 11 L29 28" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M15 23 H25" stroke="#7fe0d6" stroke-width="3.2" stroke-linecap="round"/>
      </svg>
      <span>Amba Net</span>
    </div>

    <div class="code" role="img" aria-label="Error 404">
      <span class="digit">4</span>
      <span class="orbit" aria-hidden="true">
        <span class="ring"></span>
        <span class="dot"></span>
      </span>
      <span class="digit">4</span>
    </div>

    <h1>Halaman tidak ditemukan</h1>

    <p>
      Alamat yang kamu buka tidak ada atau sudah dipindahkan.
      Cek lagi penulisannya, atau kembali ke halaman verifikasi.
    </p>

    <div class="path" id="path"></div>

    <div class="actions">
      <a class="btn btn-primary" href="index.html">Kembali ke beranda</a>
      <button class="btn btn-ghost" type="button" id="backBtn">Halaman sebelumnya</button>
    </div>

    <div class="footer">Amba Net &bull; Error 404</div>
  </main>

  <script>
    // Tampilkan alamat yang gagal dibuka
    document.getElementById("path").textContent =
      location.pathname + location.search;

    // Tombol kembali: jika tidak ada riwayat, arahkan ke beranda
    document.getElementById("backBtn").addEventListener("click", () => {
      if (history.length > 1) {
        history.back();
      } else {
        location.href = "index.html";
      }
    });
  </script>
</body>
</html>
