<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amba Net</title>

<style>
  :root {
    --bg: #e6efed;
    --card: #ffffff;
    --ink: #12302e;
    --muted: #5d7371;
    --line: #d3e0de;
    --accent: #0b7a72;
    --accent-dark: #075c56;
    --accent-soft: #d9f0ed;
    --ok: #178a4c;
    --ok-soft: #e3f5ea;
    --err: #c8372d;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 20px;
    background:
      radial-gradient(circle at 15% 10%, #cfe6e2 0, transparent 45%),
      radial-gradient(circle at 90% 90%, #d8e8f0 0, transparent 40%),
      var(--bg);
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
    color: var(--ink);
  }

  .card {
    width: 100%;
    max-width: 380px;
    padding: 30px 28px 22px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 18px;
    box-shadow: 0 18px 40px -18px rgba(11, 80, 74, .35);
    text-align: center;
    animation: cardIn .6s cubic-bezier(.2, .8, .2, 1) both;
  }

  @keyframes cardIn {
    from { opacity: 0; transform: translateY(14px) scale(.98); }
    to   { opacity: 1; transform: none; }
  }

  .brand {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }

  .brand svg { width: 34px; height: 34px; }

  .brand span {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -.3px;
  }

  /* ---------- Orb ---------- */
  .orb {
    position: relative;
    width: 84px;
    height: 84px;
    margin: 26px auto 18px;
    border-radius: 50%;
    background: var(--accent-soft);
    transition: background .4s;
  }

  .orb .ring {
    position: absolute;
    inset: 0;
    border: 6px solid transparent;
    border-top-color: var(--accent);
    border-right-color: var(--accent);
    border-radius: 50%;
    animation: spin 1s linear infinite;
    transition: border-color .4s;
  }

  .orb .ring.second {
    inset: 12px;
    border-width: 4px;
    border-top-color: #35c2b5;
    border-right-color: #35c2b5;
    animation-duration: 1.6s;
    animation-direction: reverse;
  }

  .orb svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }

  .orb path {
    fill: none;
    stroke: var(--ok);
    stroke-width: 5;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 60;
    stroke-dashoffset: 60;
    transition: stroke-dashoffset .5s ease .15s;
  }

  .card.done .orb { background: var(--ok-soft); animation: pop .5s cubic-bezier(.3, 1.6, .5, 1); }
  .card.done .orb .ring {
    animation: none;
    border-color: var(--ok);
    transform: none;
  }
  .card.done .orb .ring.second { opacity: 0; }
  .card.done .orb path { stroke-dashoffset: 0; }

  h1 {
    margin: 0;
    font-size: 21px;
    letter-spacing: -.2px;
  }

  .description {
    margin: 8px 0 0;
    color: var(--muted);
    font-size: 14px;
    line-height: 1.55;
  }

  .swap { animation: fadeUp .4s ease both; }

  /* ---------- Langkah verifikasi ---------- */
  .steps {
    list-style: none;
    margin: 22px 0 0;
    padding: 14px 16px;
    display: grid;
    gap: 12px;
    text-align: left;
    border: 1.5px solid var(--line);
    border-radius: 12px;
    background: #fafcfc;
  }

  .steps li {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 14px;
    color: #8aa09d;
    transition: color .3s;
  }

  .mark {
    position: relative;
    flex: none;
    width: 22px;
    height: 22px;
    border: 2px solid #c5d3d1;
    border-radius: 50%;
    transition: background .3s, border-color .3s;
  }

  .mark::before {
    content: "";
    position: absolute;
    inset: -2px;
    border: 3px solid transparent;
    border-top-color: var(--accent);
    border-right-color: var(--accent);
    border-radius: 50%;
    opacity: 0;
  }

  .mark svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }

  .mark path {
    fill: none;
    stroke: #fff;
    stroke-width: 3;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 20;
    stroke-dashoffset: 20;
    transition: stroke-dashoffset .3s ease .05s;
  }

  .steps li.active { color: var(--ink); font-weight: 600; }
  .steps li.active .mark { border-color: transparent; }
  .steps li.active .mark::before {
    opacity: 1;
    animation: spin .7s linear infinite;
  }

  .steps li.finished { color: var(--ink); }
  .steps li.finished .mark {
    background: var(--ok);
    border-color: var(--ok);
  }
  .steps li.finished .mark path { stroke-dashoffset: 0; }

  /* ---------- Progress ---------- */
  .progress {
    height: 5px;
    margin-top: 16px;
    border-radius: 99px;
    background: var(--accent-soft);
    overflow: hidden;
  }

  .progress-bar {
    width: 0;
    height: 100%;
    border-radius: inherit;
    background: linear-gradient(90deg, var(--accent), #35c2b5);
    transition: width .6s ease, background .4s;
  }

  .card.done .progress-bar { background: var(--ok); }

  /* ---------- Status / petunjuk ---------- */
  #status {
    min-height: 0;
    margin-top: 0;
    font-size: 13px;
    line-height: 1.5;
    color: var(--muted);
  }

  #status:not(:empty) { margin-top: 14px; }
  #status.error { color: var(--err); }

  /* ---------- Foto muncul setelah selesai ---------- */
  .reveal {
    display: grid;
    grid-template-rows: 0fr;
    opacity: 0;
    transition: grid-template-rows .8s cubic-bezier(.2, .8, .2, 1), opacity .6s ease .15s;
  }

  .reveal-inner {
    min-height: 0;
    overflow: hidden;
  }

  .card.done .reveal {
    grid-template-rows: 1fr;
    opacity: 1;
  }

  .photo {
    padding-top: 20px;
  }

  .photo img {
    display: block;
    width: auto;
    height: auto;
    max-width: 100%;
    max-height: 240px;
    margin: 0 auto;
    border-radius: 12px;
    border: 1px solid var(--line);
  }

  .footer {
    margin-top: 18px;
    padding-top: 14px;
    border-top: 1px solid var(--line);
    font-size: 12px;
    color: #8aa09d;
  }

  /* ---------- Keyframes ---------- */
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pop {
    0%   { transform: scale(.85); }
    100% { transform: scale(1); }
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: .01ms !important;
    }
  }
</style>
</head>

<body>
  <main class="card" id="card">
    <div class="brand">
      <svg viewBox="0 0 40 40" aria-hidden="true">
        <rect width="40" height="40" rx="11" fill="#0b7a72"/>
        <path d="M11 28 L20 11 L29 28" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M15 23 H25" stroke="#7fe0d6" stroke-width="3.2" stroke-linecap="round"/>
      </svg>
      <span>Amba Net</span>
    </div>

    <div class="orb" aria-hidden="true">
      <span class="ring"></span>
      <span class="ring second"></span>
      <svg viewBox="0 0 84 84"><path d="M25 43 L38 56 L60 30"/></svg>
    </div>

    <h1 id="title">Memeriksa koneksi kamu</h1>
    <p class="description" id="desc">Tunggu sebentar, kami memastikan kamu bukan robot.</p>

    <ul class="steps" id="steps">
      <li><span class="mark"><svg viewBox="0 0 22 22" aria-hidden="true"><path d="M6 11.5 L9.5 15 L16 7.5"/></svg></span>Memeriksa perangkat</li>
      <li><span class="mark"><svg viewBox="0 0 22 22" aria-hidden="true"><path d="M6 11.5 L9.5 15 L16 7.5"/></svg></span>Menganalisis perilaku</li>
      <li><span class="mark"><svg viewBox="0 0 22 22" aria-hidden="true"><path d="M6 11.5 L9.5 15 L16 7.5"/></svg></span>Mencocokkan data</li>
      <li><span class="mark"><svg viewBox="0 0 22 22" aria-hidden="true"><path d="M6 11.5 L9.5 15 L16 7.5"/></svg></span>Menyelesaikan verifikasi</li>
    </ul>

    <div class="progress" aria-hidden="true">
      <div class="progress-bar" id="bar"></div>
    </div>

    <div id="status" role="status" aria-live="polite"></div>

    <div class="reveal" id="reveal">
      <div class="reveal-inner">
        <div class="photo">
          <img src="IMG_20261010_122202_510.jpg" alt="" onerror="this.parentNode.style.display='none'">
        </div>
      </div>
    </div>

    <div class="footer">Amba Net</div>

    <audio id="sound" src="continue.mp3" preload="auto"></audio>
  </main>

  <script>
    const card = document.getElementById("card");
    const title = document.getElementById("title");
    const desc = document.getElementById("desc");
    const stepEls = Array.from(document.querySelectorAll("#steps li"));
    const bar = document.getElementById("bar");
    const statusEl = document.getElementById("status");
    const sound = document.getElementById("sound");

    // Lama tiap langkah (milidetik)
    const durations = [1000, 1300, 1100, 900];

    const sleep = ms => new Promise(r => setTimeout(r, ms));

    function swapText(el, text) {
      el.textContent = text;
      el.classList.remove("swap");
      void el.offsetWidth;
      el.classList.add("swap");
    }

    async function playSound() {
      try {
        sound.currentTime = 0;
        await sound.play();
        return null;
      } catch (err) {
        return err;
      }
    }

    const interactionEvents = ["pointerdown", "keydown", "touchstart"];

    // Jika browser memblokir suara otomatis, putar diam-diam saat sentuhan/klik/tombol pertama
    // (tanpa tulisan petunjuk apa pun)
    function playOnFirstInteraction() {
      const handler = () => {
        interactionEvents.forEach(ev => window.removeEventListener(ev, handler));
        playSound();
      };
      interactionEvents.forEach(ev => window.addEventListener(ev, handler));
    }

    // Jika pengunjung menyentuh halaman SEBELUM verifikasi selesai, buka izin audio
    // secara senyap supaya suara bisa otomatis terputar saat selesai
    function unlockAudioSilently() {
      const handler = () => {
        interactionEvents.forEach(ev => window.removeEventListener(ev, handler));
        if (card.classList.contains("done")) return;
        sound.muted = true;
        sound.play().then(() => {
          sound.pause();
          sound.currentTime = 0;
          sound.muted = false;
        }).catch(() => { sound.muted = false; });
      };
      interactionEvents.forEach(ev => window.addEventListener(ev, handler));
    }
    unlockAudioSilently();

    async function runVerification() {
      await sleep(600);

      for (let i = 0; i < stepEls.length; i++) {
        stepEls[i].classList.add("active");
        await sleep(durations[i]);
        stepEls[i].classList.remove("active");
        stepEls[i].classList.add("finished");
        bar.style.width = ((i + 1) / stepEls.length * 100) + "%";
      }

      await sleep(500);

      // Selesai: tampilkan hasil, foto, dan putar suara
      card.classList.add("done");
      swapText(title, "Verifikasi berhasil");
      swapText(desc, "Kamu terverifikasi sebagai manusia.");

      const err = await playSound();
      if (err) {
        if (err.name === "NotAllowedError") {
          playOnFirstInteraction();
        } else {
          console.warn("Suara gagal diputar. Periksa file continue.mp3.", err);
        }
      }
    }

    runVerification();
  </script>
</body>
                               </html>
